<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepFake Detection</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 60px 20px;
            text-align: center;
            background: #f8f9ff;
            transition: all 0.3s ease;
            cursor: pointer;
            margin-bottom: 30px;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f2ff;
        }

        .upload-area.dragover {
            border-color: #764ba2;
            background: #e8ebff;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 4em;
            color: #667eea;
            margin-bottom: 20px;
        }

        .upload-text {
            font-size: 1.2em;
            color: #333;
            margin-bottom: 10px;
        }

        .upload-hint {
            color: #999;
            font-size: 0.9em;
        }

        #fileInput {
            display: none;
        }

        .preview-section {
            margin-top: 30px;
            display: none;
        }

        .preview-section.active {
            display: block;
        }

        .image-preview {
            max-width: 100%;
            max-height: 400px;
            border-radius: 10px;
            margin: 20px auto;
            display: block;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .result-section {
            margin-top: 30px;
            padding: 25px;
            border-radius: 15px;
            display: none;
        }

        .result-section.active {
            display: block;
        }

        .result-section.real {
            background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
        }

        .result-section.fake {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
        }

        .result-title {
            font-size: 1.8em;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
        }

        .confidence-bar {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            height: 30px;
            margin: 15px 0;
            overflow: hidden;
            position: relative;
        }

        .confidence-fill {
            height: 100%;
            background: rgba(255, 255, 255, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #333;
            transition: width 0.5s ease;
        }

        .probabilities {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
        }

        .prob-item {
            text-align: center;
        }

        .prob-label {
            font-size: 0.9em;
            color: rgba(0, 0, 0, 0.7);
            margin-bottom: 5px;
        }

        .prob-value {
            font-size: 1.5em;
            font-weight: bold;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }

        .error-message.active {
            display: block;
        }

        .btn-reset {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1em;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s ease;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        .btn-reset:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 DeepFake Detector</h1>
        <p class="subtitle">Upload an image to detect if it's real or AI-generated</p>

        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📤</div>
            <div class="upload-text">Drag & Drop your image here</div>
            <div class="upload-hint">or click to browse</div>
            <input type="file" id="fileInput" accept="image/*">
        </div>

        <div class="preview-section" id="previewSection">
            <img id="imagePreview" class="image-preview" alt="Preview">
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Analyzing image...</p>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <div class="result-section" id="resultSection">
            <div class="result-title" id="resultTitle"></div>
            <div class="confidence-bar">
                <div class="confidence-fill" id="confidenceFill"></div>
            </div>
            <div class="probabilities">
                <div class="prob-item">
                    <div class="prob-label">Fake</div>
                    <div class="prob-value" id="fakeProb">0%</div>
                </div>
                <div class="prob-item">
                    <div class="prob-label">Real</div>
                    <div class="prob-value" id="realProb">0%</div>
                </div>
            </div>
        </div>

        <button class="btn-reset" id="resetBtn" onclick="resetForm()" style="display: none;">Upload Another Image</button>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const previewSection = document.getElementById('previewSection');
        const imagePreview = document.getElementById('imagePreview');
        const loading = document.getElementById('loading');
        const resultSection = document.getElementById('resultSection');
        const errorMessage = document.getElementById('errorMessage');
        const resetBtn = document.getElementById('resetBtn');

        // Click to upload
        uploadArea.addEventListener('click', () => fileInput.click());

        // Drag and drop handlers
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        function handleFile(file) {
            // Validate file type
            if (!file.type.startsWith('image/')) {
                showError('Please upload an image file');
                return;
            }

            // Show preview
            const reader = new FileReader();
            reader.onload = (e) => {
                imagePreview.src = e.target.result;
                previewSection.classList.add('active');
            };
            reader.readAsDataURL(file);

            // Hide previous results
            resultSection.classList.remove('active', 'real', 'fake');
            errorMessage.classList.remove('active');
            resetBtn.style.display = 'none';

            // Upload and predict
            uploadAndPredict(file);
        }

        async function uploadAndPredict(file) {
            const formData = new FormData();
            formData.append('file', file);

            // Show loading
            loading.classList.add('active');
            resultSection.classList.remove('active');

            try {
                const response = await fetch('/api/predict', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || 'Prediction failed');
                }

                // Display results
                displayResults(data);

            } catch (error) {
                showError(error.message);
            } finally {
                loading.classList.remove('active');
            }
        }

        function displayResults(data) {
            const isReal = data.prediction === 'Real';
            const confidence = (data.confidence * 100).toFixed(1);
            
            // Update result section
            resultSection.classList.add('active', isReal ? 'real' : 'fake');
            document.getElementById('resultTitle').textContent = 
                `Prediction: ${data.prediction}`;
            
            // Update confidence bar
            const confidenceFill = document.getElementById('confidenceFill');
            confidenceFill.style.width = `${confidence}%`;
            confidenceFill.textContent = `${confidence}% Confidence`;
            
            // Update probabilities
            document.getElementById('fakeProb').textContent = 
                `${(data.probabilities.fake * 100).toFixed(1)}%`;
            document.getElementById('realProb').textContent = 
                `${(data.probabilities.real * 100).toFixed(1)}%`;

            // Show reset button
            resetBtn.style.display = 'block';
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('active');
            loading.classList.remove('active');
        }

        function resetForm() {
            fileInput.value = '';
            previewSection.classList.remove('active');
            resultSection.classList.remove('active', 'real', 'fake');
            errorMessage.classList.remove('active');
            resetBtn.style.display = 'none';
            imagePreview.src = '';
        }
    </script>
</body>
</html>
